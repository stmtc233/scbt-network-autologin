name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      # --- Generate default config.json for release package ---
      - name: Prepare default config
        run: |
          go run . -init || true

      # --- Windows x64 Build ---
      - name: Build for Windows x64
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o scbt-autologin-windows-amd64.exe .
      - name: Package Windows artifact
        run: |
          mkdir -p release/scbt-windows-amd64
          cp scbt-autologin-windows-amd64.exe release/scbt-windows-amd64/
          cp config.json release/scbt-windows-amd64/ || true
          cp .env release/scbt-windows-amd64/ || true
          zip -r scbt-windows-amd64.zip release/scbt-windows-amd64

      # --- Linux x64 Build ---
      - name: Build for Linux x64
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o scbt-autologin-linux-amd64 .
      - name: Package Linux x64 artifact
        run: |
          mkdir -p release/scbt-linux-amd64
          cp scbt-autologin-linux-amd64 release/scbt-linux-amd64/
          cp config.json release/scbt-linux-amd64/ || true
          cp .env release/scbt-linux-amd64/ || true
          tar -czvf scbt-linux-amd64.tar.gz -C release/scbt-linux-amd64 .

      # --- Linux arm64 Build ---
      - name: Build for Linux arm64
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o scbt-autologin-linux-arm64 .
      - name: Package Linux arm64 artifact
        run: |
          mkdir -p release/scbt-linux-arm64
          cp scbt-autologin-linux-arm64 release/scbt-linux-arm64/
          cp config.json release/scbt-linux-arm64/ || true
          cp .env release/scbt-linux-arm64/ || true
          tar -czvf scbt-linux-arm64.tar.gz -C release/scbt-linux-arm64 .

      # --- Create Release and Upload Artifacts ---
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false

      - name: Upload Windows Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./scbt-windows-amd64.zip
          asset_name: scbt-windows-amd64.zip
          asset_content_type: application/zip

      - name: Upload Linux x64 Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./scbt-linux-amd64.tar.gz
          asset_name: scbt-linux-amd64.tar.gz
          asset_content_type: application/gzip

      - name: Upload Linux arm64 Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./scbt-linux-arm64.tar.gz
          asset_name: scbt-linux-arm64.tar.gz
          asset_content_type: application/gzip
